name: Test Automation CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
permissions:
  contents: read
  checks: write
  pull-requests: write
  
jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['21']
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Verify Java Installation
      run: java -version

    - name: Build with Maven
      run: mvn clean compile -B -V

    - name: Run Tests
      run: mvn clean test -B

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: Test_Reports/
        retention-days: 30

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: target/surefire-reports/TEST-*.xml
        check_name: Test Results

    - name: Comment Test Results on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'Test_Reports/test-summary.json';
          
          if (fs.existsSync(reportPath)) {
            const summary = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const comment = `## Test Execution Summary
            
            - **Total Tests**: ${summary.total}
            - **Passed**: ✅ ${summary.passed}
            - **Failed**: ❌ ${summary.failed}
            - **Skipped**: ⏭️ ${summary.skipped}
            - **Duration**: ${summary.duration}s
            
            [View Full Report](artifacts)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

    - name: Notify on Failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ **Test Execution Failed**\n\nPlease review the test logs and fix the failing tests.'
          })

  quality-check:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean compile -B -DskipTests

    - name: Run SonarQube Analysis (Optional)
      run: |
        echo "SonarQube analysis can be added here"
        # mvn sonar:sonar -Dsonar.projectKey=your-project-key

  notify:
    runs-on: ubuntu-latest
    needs: [test, quality-check]
    if: always()
    
    steps:
    - name: Send Slack Notification
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "❌ Test Automation Pipeline Failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Test Automation Pipeline Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Details"
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }

    - name: Create GitHub Issue on Failure
      if: failure() && github.event_name == 'push'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[CI/CD] Test Pipeline Failed - ${new Date().toLocaleDateString()}`,
            body: `## Pipeline Failure Report\n\n- **Run ID**: ${{ github.run_id }}\n- **Branch**: ${{ github.ref }}\n- **Commit**: ${{ github.sha }}\n- **Author**: ${{ github.actor }}\n\n[View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            labels: ['bug', 'ci-cd']
          })
