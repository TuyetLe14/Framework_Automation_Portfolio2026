name: Test Automation CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write
  
jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21']
        browser: [chrome]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Verify Java Installation
      run: java -version

    - name: Build with Maven
      run: mvn clean compile -B -V

    - name: Run Tests (${{ matrix.browser }})
      run: mvn clean test -B -Dheadless=true -Dbrowser=${{ matrix.browser }}

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.browser }}
        path: Test_Reports/
        retention-days: 30

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: target/surefire-reports/TEST-*.xml
        check_name: Test Results (${{ matrix.browser }})

    - name: Comment Test Results on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'Test_Reports/test-summary.json';
          
          if (fs.existsSync(reportPath)) {
            const summary = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const comment = `## Test Execution Summary
            
            - **Total Tests**: ${summary.total}
            - **Passed**: ✅ ${summary.passed}
            - **Failed**: ❌ ${summary.failed}
            - **Skipped**: ⏭️ ${summary.skipped}
            - **Duration**: ${summary.duration}s
            
            [View Full Report](artifacts)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

    - name: Notify on Failure
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ **Test Execution Failed**\n\nPlease review the test logs and fix the failing tests.'
          })
  api-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run API Tests
      run: mvn clean test -B -DsuiteXmlFile=testng-api.xml

    - name: Publish API Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: target/surefire-reports/TEST-*.xml
        check_name: API Test Results

    - name: Upload API Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-test-reports
        path: target/surefire-reports/
        retention-days: 30
  
