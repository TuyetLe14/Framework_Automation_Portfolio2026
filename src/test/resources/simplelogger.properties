# SLF4J Simple Logger Configuration
# Available levels: TRACE, DEBUG, INFO, WARN, ERROR

# Root logger level
org.slf4j.simpleLogger.defaultLogLevel=INFO

# Specific logger levels
org.slf4j.simpleLogger.log.com.tuyet=DEBUG
org.slf4j.simpleLogger.log.org.openqa.selenium=WARN

# Timestamp format (none, SOP, DEFAULT, ISO_8601_BASIC, ISO_8601)
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Show thread name
org.slf4j.simpleLogger.showThreadName=true

# Show logger name
org.slf4j.simpleLogger.showLogName=true

# Show short logger name
org.slf4j.simpleLogger.showShortLogName=false

# Log file output (leave empty for stdout)
org.slf4j.simpleLogger.logFile=System.out

# Cache logger instances
org.slf4j.simpleLogger.cacheLoggers=true

# Warn levels in color (if supported)
org.slf4j.simpleLogger.levelInBrackets=true

# Include MDC/NDC (Mapped Diagnostic Context)
org.slf4j.simpleLogger.includeMdcKeyName=false
