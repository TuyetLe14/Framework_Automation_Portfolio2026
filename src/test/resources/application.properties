# ====================================================================
# Test Automation Framework - Configuration Properties
# ====================================================================

# Application Configuration
app.url=https://your-app-url.com
app.environment=dev

# Browser Configuration
browser.name=chrome
browser.headless=false
browser.window.maximize=true
browser.accept.insecure.certs=true

# Chrome-specific Options
chrome.options.remote-allow-origins=*
chrome.options.disable-gpu=false

# Timeouts (seconds)
timeout.implicit=10
timeout.explicit=10
timeout.pageLoad=60
timeout.script=30

# WebDriver Configuration
webdriver.http.timeout=5000

# Screenshot Configuration
screenshot.enabled=true
screenshot.on.failure=true
screenshot.path=Test_Reports/Screenshots

# Video Recording Configuration
video.enabled=true
video.on.failure=true
video.on.all.tests=false
video.path=Test_Reports/Videos

# Logging Configuration
log.level=INFO
log.pattern=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Report Configuration
report.enabled=true
report.type=extent
report.path=Test_Reports
report.title=Test Automation Report
report.author=QA Team

# Retry Configuration
retry.enabled=true
retry.count=2
retry.test.failure.only=true

# Test Data Configuration
testdata.path=src/test/resources/testdata
testdata.format=excel

# Email Configuration (Optional - for CI/CD notifications)
email.enabled=false
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.sender=your-email@gmail.com
email.password=${EMAIL_PASSWORD}
email.recipient=your-recipient@example.com

# Parallel Execution Configuration
parallel.enabled=false
parallel.threads=3
parallel.method=methods

# Database Configuration (Optional - for data validation)
db.enabled=false
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/test_db
db.username=${DB_USERNAME}
db.password=${DB_PASSWORD}

# API Testing Configuration (Optional - future use)
api.enabled=false
api.baseurl=https://api.example.com
api.timeout=5000

# Environment-specific overrides
# Uncomment and modify as needed for different environments
# For staging: app.url=https://staging.example.com
# For production: app.url=https://prod.example.com
